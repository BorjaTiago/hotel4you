name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check that no secret file is tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env|application\.properties)$'; then echo "A secret file is tracked." && exit 1; fi
      - name: Build and test
        run: ./mvnw -B verify
      - name: Generate Javadoc
        run: ./mvnw -B javadoc:javadoc
