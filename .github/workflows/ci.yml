name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check that no secret file is tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env|application\.properties)$'; then echo "A secret file is tracked." && exit 1; fi
      - name: Check that commit messages start with the Jira key
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          bad=$(git log --no-merges --format=%s "origin/$BASE_BRANCH..HEAD" | grep -vE '^H4Y-[0-9]+:? ' || true)
          if [ -n "$bad" ]; then echo "These commits do not start with the Jira key (H4Y-NN: message):" && echo "$bad" && exit 1; fi
      - name: Build and test
        run: ./mvnw -B verify
      - name: Generate Javadoc
        run: ./mvnw -B javadoc:javadoc
      - name: Save the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports
