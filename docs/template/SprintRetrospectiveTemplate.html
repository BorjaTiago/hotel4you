<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Sprint Retrospective</title>
<style>
html{background:#fff}
body{margin:0;padding:35pt 42.5pt 14pt 42.5pt;width:510pt;font-family:"Arial MT",Arial,"Liberation Sans",Helvetica,sans-serif;font-size:11pt;color:#000;background:#fff;box-sizing:content-box}
p,h1,div{margin:0;padding:0}
.title{font-size:14pt;font-weight:normal;color:#172A4D;margin:3.65pt 0 0 0;line-height:16pt}
.sp{display:block}
h1{font-size:11.5pt;font-weight:normal;color:#172A4D;margin-left:0;position:relative;line-height:13.2pt}
.body{font-size:8pt;color:#172A4D;margin-left:5.4pt;line-height:9.2pt}
.body a{color:#0052CC;text-decoration:none}
table{border-collapse:collapse;table-layout:fixed;margin-left:0;border:.75pt solid #C1C7D0;font-family:Arial,"Liberation Sans",Helvetica,sans-serif}
td,th{box-sizing:border-box}
td{border:.75pt solid #C1C7D0;padding:0;vertical-align:top}
.info td{height:12.9pt}
.info td:first-child{background:#F4F5F6;width:164.3pt;font-size:8pt;font-weight:bold;color:#172A4D;padding:2pt 0 0 4.2pt;vertical-align:middle}
.retro{width:498.5pt}
.retro th{font-size:8pt;font-weight:bold;color:#172A4D;text-align:left;padding:2pt 0 0 3.3pt;height:14.4pt;border:.75pt solid #C1C7D0;vertical-align:top}
.retro td{height:14.4pt}
.retro tr:last-child td{height:13.5pt}
.l{margin:0;padding:0 0 0 14pt;font-size:8pt;line-height:1.5;color:#172a4d;list-style:disc}
.dot{display:block;width:1.55pt;height:1.55pt;border-radius:50%;background:#172a4d;margin:7pt 0 0 4.2pt}
.panel{position:relative;margin-left:5.4pt;width:499.1pt;height:37.3pt;background:#deebff;border-radius:1.3pt}
.panel img{position:absolute;left:5.1pt;top:7.15pt;width:10.25pt;height:10.25pt}
.panel p{position:absolute;left:0;top:0;margin:6.75pt 7.8pt 0 20.4pt;font-size:8pt;line-height:12pt;color:#172A4D;font-family:"Arial MT",Arial,"Liberation Sans",sans-serif}
.q{font-family:Arial,"Liberation Sans",Helvetica,sans-serif;font-size:8pt;font-weight:bold;color:#172A4D}
@page{size:A4;margin:0}
html,body,table,td,th,.panel,img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
table,h1,.panel,h1{break-after:avoid;page-break-after:avoid}
</style>
</head>
<body>
<p class="title">Sprint Retrospective</p>
<div class="sp" style="height:53.5pt"></div>
<h1>📋 Visão geral</h1>
<div class="sp" style="height:21.3pt"></div>
<table class="info"><colgroup><col style="width:164.3pt"><col style="width:334.2pt"></colgroup>
<tr><td>Data</td><td></td></tr>
<tr><td>Equipa</td><td></td></tr>
<tr><td>Participantes</td><td></td></tr></table>
<div class="sp" style="height:24.3pt"></div>
<h1 style="margin-top:0">💭 Retrospetiva</h1>
<div class="sp" style="height:6.5pt"></div>
<table class="retro"><colgroup><col style="width:166.35pt"><col style="width:166.35pt"><col style="width:165.85pt"></colgroup>
<tr><th style="background:#E3FBEF">Começar a fazer</th><th style="background:#FFEBE6">Parar de fazer</th><th style="background:#E6FBFF">Continuar a fazer</th></tr>
<tr><td></td><td></td><td></td></tr>
<tr><td></td><td></td><td></td></tr></table>
<div class="sp" style="height:26pt"></div>
<h1 style="margin-top:0">✅ Ações a tomar</h1>
<div class="act" style="margin-top:13pt;font-size:10pt;line-height:1.5;color:#172a4d">- </div>
<div class="sp" style="height:138pt"></div>
</body>
</html>
